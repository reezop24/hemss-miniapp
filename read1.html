<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bahagian 1 (View)</title>

<style>
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #0f172a;
    color: #e5e7eb;
  }

  .container {
    padding: 16px;
  }

  h1, h2 {
    text-align: center;
    margin: 4px 0;
  }

  h1 { font-size: 18px; }
  h2 { font-size: 14px; opacity: .8; }

  hr {
    border: none;
    border-top: 1px solid #1f2933;
    margin: 18px 0;
  }

  /* ===== SOALAN ===== */
  .view-question {
    background: #1e293b;
    padding: 10px 12px;
    font-weight: 600;
    border-radius: 6px;
    margin-top: 14px;
  }

  /* ===== KATEGORI (DALAM JAWAPAN) ===== */
  .view-category {
    margin: 8px 0 4px 8px;
    font-weight: 600;
  }

  /* ===== JAWAPAN ===== */
  .view-answer {
    background: #f8fafc;
    color: #0f172a;
    font-family: "Courier New", monospace;
    border-radius: 4px;
    padding: 6px 8px;
    margin: 4px 0 4px 14px;
  }

  .has-data {
    border-left: 4px solid #22c55e;
  }

  .no-data {
    border-left: 4px solid #ef4444;
    color: #94a3b8;
  }

  .view-empty {
    margin-left: 14px;
    font-family: "Courier New", monospace;
    opacity: .7;
  }

  .view-summary {
    margin-left: 14px;
    margin-top: 6px;
    font-size: 13px;
    opacity: .85;
  }

  .overall-summary {
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.15);
    font-weight: 600;
  }

  .overall-summary span {
    display: block;
    font-family: "Courier New", monospace;
    margin-top: 4px;
  }

  .btn {
    width: 100%;
    margin-top: 22px;
    padding: 12px;
    border: none;
    border-radius: 6px;
    background: #7c2d12;
    color: #fff;
    font-size: 15px;
  }
</style>
</head>

<body>

<div class="container">

  <h1>Unit HEM SMK Seri Sendayan</h1>
  <h2>LAPORAN GURU BERTUGAS MINGGUAN</h2>

  <hr>

  <div id="report"></div>

  <button id="btnEdit" class="btn">✏️ Ubah Semula Bahagian Ini</button>

</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="appread1.js"></script>
</body>
</html>
