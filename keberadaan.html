<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keberadaan Guru</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #1f3554;
  color: #f1f1f1;
  padding: 20px;
  font-size: 16px;
}

h2 {
  text-align: center;
  margin-bottom: 25px;
  font-weight: 600;
}

.section {
  margin-bottom: 30px;
  padding-bottom: 15px;
  border-bottom: 1px solid rgba(255,255,255,0.2);
}

.section-title {
  font-weight: 600;
  margin-bottom: 12px;
}

input {
  width: 100%;
  padding: 10px;
  font-size: 15px;
  margin-bottom: 10px;
  border-radius: 6px;
  border: none;
  box-sizing: border-box;
}

button.secondary {
  width: 100%;
  padding: 8px;
  font-size: 14px;
  border-radius: 6px;
  border: none;
  background-color: rgba(255,255,255,0.15);
  color: white;
  margin-bottom: 8px;
}

textarea {
  width: 100%;
  min-height: 120px;
  padding: 12px;
  font-size: 15px;
  border-radius: 6px;
  border: none;
  box-sizing: border-box;
}

button.primary {
  width: 100%;
  margin-top: 25px;
  padding: 14px;
  font-size: 16px;
  border-radius: 6px;
  border: none;
  background-color: #27ae60;
  color: white;
  font-weight: 600;
}
</style>
</head>

<body>

<h2>KEBERADAAN GURU</h2>

<div id="kategori_1" class="section">
  <div class="section-title">CR / CTR / CRK / MC / KUARANTIN</div>
  <div class="container"></div>
  <button class="secondary" onclick="addBox('kategori_1')">+ Tambah</button>
</div>

<div id="kategori_2" class="section">
  <div class="section-title">BENGKEL / MESYUARAT / TAKLIMAT</div>
  <div class="container"></div>
  <button class="secondary" onclick="addBox('kategori_2')">+ Tambah</button>
</div>

<div id="kategori_3" class="section">
  <div class="section-title">TEMUJANJI / RAWATAN</div>
  <div class="container"></div>
  <button class="secondary" onclick="addBox('kategori_3')">+ Tambah</button>
</div>

<div id="kategori_4" class="section">
  <div class="section-title">LAIN-LAIN</div>
  <div class="container"></div>
  <button class="secondary" onclick="addBox('kategori_4')">+ Tambah</button>
</div>

<div class="section">
  <div class="section-title">CATATAN</div>
  <textarea id="catatan" placeholder="Masukkan catatan jika ada..."></textarea>
</div>

<button class="primary" onclick="submitData()">💾 Simpan</button>

<datalist id="guru_list"></datalist>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="nameset.js"></script>
<script src="keberadaan.js"></script>

</body>
</html>
