<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keberadaan Guru</title>

<style>
.section {
  margin-bottom: 24px;
  padding-bottom: 14px;
  border-bottom: 1px solid rgba(255,255,255,0.2);
}

.section-title {
  font-weight: 600;
  margin-bottom: 10px;
}

input {
  margin-bottom: 10px;
}

.section-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.add-btn {
  width: auto;
  padding: 6px 12px;
  font-size: 13px;
  border-radius: 20px;
  border: none;
  background-color: rgba(255,255,255,0.15);
  color: white;
}

.remove-btn {
  padding: 5px 10px;
  font-size: 12px;
  border-radius: 4px;
  border: none;
  background: #c0392b;
  color: white;
  margin-bottom: 8px;
}

textarea {
  min-height: 120px;
}

button.primary {
  width: 100%;
  margin-top: 25px;
  padding: 14px;
  font-size: 16px;
  border-radius: 6px;
  border: none;
  background-color: #27ae60;
  color: white;
  font-weight: 600;
}
</style>

<link rel="stylesheet" href="theme.css?v=20260214a">
</head>

<body>

<h2>KEBERADAAN GURU</h2>

<div id="kategori_1" class="section">
  <div class="section-title">CR / CTR / CRK / MC / KUARANTIN</div>
  <div class="container"></div>
  <div class="section-actions">
    <button class="add-btn" onclick="addBox('kategori_1')">+ Tambah Guru</button>
    <button class="add-btn" onclick="addBox('kategori_1', 'pentadbir')">+ Tambah Pentadbir</button>
  </div>
</div>

<div id="kategori_2" class="section">
  <div class="section-title">BENGKEL / MESYUARAT / TAKLIMAT</div>
  <div class="container"></div>
  <div class="section-actions">
    <button class="add-btn" onclick="addBox('kategori_2')">+ Tambah Guru</button>
    <button class="add-btn" onclick="addBox('kategori_2', 'pentadbir')">+ Tambah Pentadbir</button>
  </div>
</div>

<div id="kategori_3" class="section">
  <div class="section-title">TEMUJANJI / RAWATAN</div>
  <div class="container"></div>
  <div class="section-actions">
    <button class="add-btn" onclick="addBox('kategori_3')">+ Tambah Guru</button>
    <button class="add-btn" onclick="addBox('kategori_3', 'pentadbir')">+ Tambah Pentadbir</button>
  </div>
</div>

<div id="kategori_4" class="section">
  <div class="section-title">LAIN-LAIN</div>
  <div class="container"></div>
  <div class="section-actions">
    <button class="add-btn" onclick="addBox('kategori_4')">+ Tambah Guru</button>
    <button class="add-btn" onclick="addBox('kategori_4', 'pentadbir')">+ Tambah Pentadbir</button>
  </div>
</div>

<div class="section">
  <div class="section-title">CATATAN</div>
  <textarea id="catatan" placeholder="Masukkan catatan jika ada..."></textarea>
</div>

<button class="primary" onclick="submitData()">💾 Simpan</button>
<div id="read-only-status" class="section" style="display:none;">
  <div class="section-title">STATUS</div>
  <div style="font-weight:600;">READ ONLY</div>
  <div style="margin-top:8px; opacity:0.9;">Bahagian ini telah disimpan. Tekan butang di bawah untuk ubah semula.</div>
</div>
<button id="edit-btn" class="primary" style="display:none;">✏️ Ubah Semula</button>

<datalist id="guru_list"></datalist>
<datalist id="pentadbir_list"></datalist>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="nameset.js"></script>
<script src="keberadaan.js"></script>
<script src="brand.js"></script>

</body>
</html>
