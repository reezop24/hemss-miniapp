<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keberadaan Guru</title>

<style>
.section {
  margin-bottom: 24px;
  padding-bottom: 14px;
  border-bottom: 1px solid rgba(255,255,255,0.2);
}

.section-title {
  font-weight: 600;
  margin-bottom: 10px;
}

input {
  margin-bottom: 10px;
}

.add-btn {
  width: auto;
  padding: 6px 12px;
  font-size: 13px;
  border-radius: 20px;
  border: none;
  background-color: rgba(255,255,255,0.15);
  color: white;
}

.remove-btn {
  padding: 5px 10px;
  font-size: 12px;
  border-radius: 4px;
  border: none;
  background: #c0392b;
  color: white;
  margin-bottom: 8px;
}

textarea {
  min-height: 120px;
}

button.primary {
  width: 100%;
  margin-top: 25px;
  padding: 14px;
  font-size: 16px;
  border-radius: 6px;
  border: none;
  background-color: #27ae60;
  color: white;
  font-weight: 600;
}
</style>

<link rel="stylesheet" href="theme.css">
</head>

<body>

<h2>KEBERADAAN GURU</h2>

<div id="kategori_1" class="section">
  <div class="section-title">CR / CTR / CRK / MC / KUARANTIN</div>
  <div class="container"></div>
  <button class="add-btn" onclick="addBox('kategori_1')">+ Tambah</button>
</div>

<div id="kategori_2" class="section">
  <div class="section-title">BENGKEL / MESYUARAT / TAKLIMAT</div>
  <div class="container"></div>
  <button class="add-btn" onclick="addBox('kategori_2')">+ Tambah</button>
</div>

<div id="kategori_3" class="section">
  <div class="section-title">TEMUJANJI / RAWATAN</div>
  <div class="container"></div>
  <button class="add-btn" onclick="addBox('kategori_3')">+ Tambah</button>
</div>

<div id="kategori_4" class="section">
  <div class="section-title">LAIN-LAIN</div>
  <div class="container"></div>
  <button class="add-btn" onclick="addBox('kategori_4')">+ Tambah</button>
</div>

<div class="section">
  <div class="section-title">CATATAN</div>
  <textarea id="catatan" placeholder="Masukkan catatan jika ada..."></textarea>
</div>

<button class="primary" onclick="submitData()">💾 Simpan</button>

<datalist id="guru_list"></datalist>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="nameset.js"></script>
<script src="keberadaan.js"></script>
<script src="brand.js"></script>

</body>
</html>
