<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kumpulan Guru Bertugas</title>

<link rel="stylesheet" href="style.css">

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #1f3554;
  color: #f1f1f1;
  padding: 20px;
  font-size: 17px;
}

h2 {
  text-align: center;
  margin-bottom: 25px;
}

.section {
  margin-bottom: 25px;
  padding-bottom: 15px;
  border-bottom: 1px solid rgba(255,255,255,0.2);
}

.section-title {
  font-weight: 600;
  margin-bottom: 10px;
  font-size: 16px;
  opacity: 0.9;
}

input, select {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  margin-bottom: 12px;
  border-radius: 6px;
  border: none;
  box-sizing: border-box;
}

button.primary {
  width: 100%;
  padding: 14px;
  font-size: 17px;
  border-radius: 6px;
  border: none;
  background-color: #4da3ff;
  color: white;
  font-weight: 600;
}

button.secondary {
  width: 100%;
  padding: 10px;
  font-size: 14px;
  border-radius: 6px;
  border: none;
  background-color: rgba(255,255,255,0.15);
  color: white;
  margin-bottom: 10px;
}

h3 {
  margin-top: 25px;
  margin-bottom: 8px;
  font-size: 17px;
  font-weight: 600;
}

hr {
  border: none;
  border-top: 1px solid rgba(255,255,255,0.15);
  margin: 25px 0;
}

input[readonly] {
  background: #e5e5e5;
  font-weight: 600;
}


  

</style>
</head>

<body>

<h2>👥 Kumpulan Guru Bertugas</h2>

<div id="guru-container"></div>

<button type="button" onclick="addBox()">+ Tambah Guru (Max 6)</button>

<hr>

<h3>Minggu Bertugas</h3>
<select id="minggu"></select>

<hr>

<h3>Tarikh Laporan</h3>
<input type="text" id="tarikh" readonly>

<h3>Hari</h3>
<input type="text" id="hari" readonly>

<hr>

<button onclick="submitData()">💾 Simpan</button>



<datalist id="guru_list"></datalist>

<script src="https://telegram.org/js/telegram-web-app.js"></script> 
<script src="nameset.js"></script>
<script src="preset.js"></script>
<script src="guru.js"></script>

</body>
</html>
