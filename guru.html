<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kumpulan Guru Bertugas</title>


<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #1f3554;
  color: #f1f1f1;
  padding: 18px;
  font-size: 15px;
}

h2 {
  text-align: center;
  margin-bottom: 20px;
  font-size: 20px;
  font-weight: 600;
}

.section {
  margin-bottom: 22px;
}

.section-title {
  font-weight: 600;
  margin-bottom: 10px;
  font-size: 14px;
  opacity: 0.9;
  letter-spacing: 0.5px;
}

input, select {
  width: 100%;
  padding: 10px 12px;
  font-size: 15px;
  margin-bottom: 10px;
  border-radius: 5px;
  border: none;
  box-sizing: border-box;
}

input[readonly] {
  background: #e5e5e5;
  font-weight: 600;
  color: #222;
}

button.add-btn {
  width: auto;
  padding: 6px 12px;
  font-size: 13px;
  border-radius: 20px;
  border: none;
  background-color: rgba(255,255,255,0.15);
  color: white;
}

button.remove-btn {
  padding: 5px 10px;
  font-size: 12px;
  border-radius: 4px;
  border: none;
  background: #c0392b;
  color: white;
  margin-bottom: 8px;
}

button.save-btn {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  border-radius: 6px;
  border: none;
  background-color: #2ecc71;
  color: white;
  font-weight: 600;
}

hr {
  border: none;
  border-top: 1px solid rgba(255,255,255,0.15);
  margin: 22px 0;
}
</style>

<link rel="stylesheet" href="theme.css">
</head>

<body>

<h2>👥 Kumpulan Guru Bertugas</h2>

<div class="section">
  <div class="section-title">Senarai Guru</div>
  <div id="guru-container"></div>
  <button type="button" class="add-btn" onclick="addBox()">+ Tambah Guru (Max 6)</button>
</div>

<hr>

<div class="section">
  <div class="section-title">Minggu Bertugas</div>
  <select id="minggu"></select>
</div>

<hr>

<div class="section">
  <div class="section-title">Tarikh Laporan</div>
  <input type="text" id="tarikh" readonly>
</div>

<div class="section">
  <div class="section-title">Hari</div>
  <input type="text" id="hari" readonly>
</div>

<hr>

<button class="save-btn" onclick="submitData()">Simpan</button>

<datalist id="guru_list"></datalist>

<script src="https://telegram.org/js/telegram-web-app.js"></script> 
<script src="nameset.js"></script>
<script src="preset.js"></script>
<script src="guru.js"></script>

</body>
</html>
