<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kumpulan Guru Bertugas</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #1e3a5f;
  color: white;
  padding: 24px;
  font-size: 18px;
}

h2 {
  text-align: center;
  margin-bottom: 20px;
}

select, input {
  width: 100%;
  padding: 14px;
  font-size: 18px;
  margin-bottom: 15px;
  border-radius: 8px;
  border: none;
  box-sizing: border-box;
}

button {
  width: 100%;
  padding: 16px;
  font-size: 20px;
  border-radius: 10px;
  border: none;
  background-color: #4da3ff;
  color: white;
  font-weight: 600;
  margin-top: 10px;
}
</style>
</head>

<body>

<h2>👥 Kumpulan Guru Bertugas</h2>

<div id="guru-container"></div>

<button onclick="addBox()">➕ Tambah Guru (Max 6)</button>

<select id="minggu"></select>

<button onclick="submitData()">💾 Simpan</button>

<script src="nameset.js"></script>
<script src="preset.js"></script>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

let maxGuru = 6;
let currentGuru = 5;

// ===== Generate 5 default search box =====
function createGuruBox(index) {
    const input = document.createElement("input");
    input.setAttribute("list", "guru_list");
    input.id = "guru_" + index;
    input.placeholder = "Nama Guru " + index;
    return input;
}

function initGuru() {
    const container = document.getElementById("guru-container");
    for (let i = 1; i <= 5; i++) {
        container.appendChild(createGuruBox(i));
    }
}

function addBox() {
    if (currentGuru >= maxGuru) return;
    currentGuru++;
    const container = document.getElementById("guru-container");
    container.appendChild(createGuruBox(currentGuru));
}

// ===== Datelist Guru =====
const datalist = document.createElement("datalist");
datalist.id = "guru_list";
NAME_SET.forEach(name => {
    const option = document.createElement("option");
    option.value = name;
    datalist.appendChild(option);
});
document.body.appendChild(datalist);

// ===== Minggu Dropdown =====
const mingguSelect = document.getElementById("minggu");
MINGGU_LIST.forEach(m => {
    const option = document.createElement("option");
    option.value = m;
    option.text = m;
    mingguSelect.appendChild(option);
});

// ===== Submit =====
function submitData() {

    const guruData = {};
    for (let i = 1; i <= currentGuru; i++) {
        const val = document.getElementById("guru_" + i).value;
        if (val) {
            guruData["guru_" + i] = val;
        }
    }

    const data = {
        type: "section_guru_bertugas",
        data: {
            minggu: mingguSelect.value,
            guru: guruData
        }
    };

    tg.sendData(JSON.stringify(data));
}

initGuru();
</script>

</body>
</html>
