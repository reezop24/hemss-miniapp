<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bahagian 1 (View)</title>

<style>
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #0f172a;
    color: #e5e7eb;
  }

  .container {
    padding: 16px;
  }

  h1, h2 {
    text-align: center;
    margin: 4px 0;
  }

  h1 { font-size: 18px; }
  h2 { font-size: 14px; opacity: .8; }

  hr {
    border: none;
    border-top: 1px solid #1f2933;
    margin: 18px 0;
  }

  /* SOALAN */
  .view-question {
    background: #1e293b;
    padding: 10px 12px;
    font-weight: 600;
    border-radius: 6px;
    margin-top: 14px;
  }

  /* JAWAPAN */
  .view-answer {
    padding: 6px 4px 6px 8px;
    margin-left: 6px;
    font-family: "Courier New", monospace;
    font-size: 14px;
  }

  .view-empty {
    font-style: italic;
    opacity: 0.6;
    margin: 6px 8px;
    font-family: "Courier New", monospace;
  }

  .view-summary {
    margin-left: 8px;
    margin-top: 6px;
    opacity: 0.8;
    font-size: 13px;
  }

  .view-total {
    background: #020617;
    border: 1px solid #1e293b;
    padding: 10px;
    border-radius: 6px;
    margin-top: 16px;
    font-size: 14px;
  }

  .btn {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    border: none;
    border-radius: 6px;
    background: #7c2d12;
    color: #fff;
    font-size: 15px;
  }
</style>
</head>

<body>

<div class="container">

  <h1>Unit HEM SMK Seri Sendayan</h1>
  <h2>LAPORAN GURU BERTUGAS MINGGUAN</h2>

  <hr>

  <div id="report"></div>

  <button id="btnEdit" class="btn">
    ✏️ Ubah Semula Bahagian Ini
  </button>

</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="app_view1.js"></script>

</body>
</html>
