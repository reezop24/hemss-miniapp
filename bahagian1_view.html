<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bahagian 1 – Paparan Laporan</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .container {
      padding: 16px;
      max-width: 720px;
      margin: auto;
    }

    h1, h2 {
      text-align: center;
      margin: 4px 0;
    }

    h1 { font-size: 18px; }
    h2 { font-size: 15px; font-weight: normal; }

    /* ===== SOALAN ===== */
    .question-box {
      background: #e3e8f0;
      padding: 10px 12px;
      margin-top: 16px;
      font-weight: 600;
      border-radius: 6px;
    }

    /* ===== JAWAPAN ===== */
    .answer {
      margin-top: 6px;
      padding-left: 6px;
      font-family: "Courier New", monospace;
      font-size: 14px;
      color: #333;
    }

    .answer div {
      margin-bottom: 4px;
    }

    hr {
      margin: 20px 0;
      border: none;
      border-top: 1px solid #ccc;
    }

    .btn {
      width: 100%;
      padding: 12px;
      margin-top: 18px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
    }

    .btn-edit {
      background: #e67e22;
    }
  </style>
</head>

<body>
<div class="container">

  <h1>Unit HEM SMK Seri Sendayan</h1>
  <h2>LAPORAN GURU BERTUGAS MINGGUAN</h2>

  <!-- 1 -->
  <div class="question-box">1. Kumpulan Guru Bertugas</div>
  <div class="answer" id="ans-guru"></div>

  <!-- 2 -->
  <div class="question-box">2. Minggu</div>
  <div class="answer" id="ans-minggu"></div>

  <!-- 3 -->
  <div class="question-box">3. Tarikh</div>
  <div class="answer" id="ans-tarikh"></div>

  <!-- 4 -->
  <div class="question-box">4. Hari</div>
  <div class="answer" id="ans-hari"></div>

  <hr>

  <button class="btn btn-edit" id="btnEdit">
    Bahagian ini telah disimpan — Ubah Semula?
  </button>

</div>

</html>
