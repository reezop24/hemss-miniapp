<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>User Log</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="userlog.js"></script>
<link rel="stylesheet" href="theme.css?v=20260215c">

<style>
body {
  margin: 0;
  padding: 20px;
}

h2 {
  text-align: center;
  margin-bottom: 18px;
}

.section {
  margin-bottom: 14px;
}

.stat {
  font-size: 14px;
  color: var(--text-muted);
  margin-bottom: 4px;
}

.user-list {
  display: grid;
  gap: 10px;
}

.user-item {
  background: rgba(255, 255, 255, 0.08);
  border-radius: 10px;
  padding: 12px;
  border: 1px solid rgba(255, 255, 255, 0.1);
}

.user-name {
  font-weight: 700;
  margin-bottom: 6px;
}

.user-meta {
  font-size: 13px;
  line-height: 1.45;
  color: var(--text-muted);
}

.admin-tag {
  color: #ffd84d;
  font-weight: 700;
}

.empty {
  color: var(--text-muted);
  font-size: 14px;
}
</style>
</head>
<body>
  <h2>USER LOG</h2>

  <div class="section">
    <div id="guruStat" class="stat">Guru berdaftar: -</div>
    <div id="totalStat" class="stat">Jumlah pengguna: -</div>
  </div>

  <div class="section">
    <div id="userList" class="user-list"></div>
    <div id="emptyState" class="empty" style="display:none;">Tiada rekod pengguna.</div>
  </div>

  <script src="brand.js"></script>
</body>
</html>
