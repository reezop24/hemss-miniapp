<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Laporan Perhimpunan</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="nameset.js"></script>
<script src="perhimpunan.js"></script>

<style>
body {
    background: #243B55;
    font-family: sans-serif;
    color: white;
    margin: 0;
    padding: 20px;
}

h2 {
    text-align: center;
    margin-bottom: 25px;
}

.section {
    background: #2f4a6a;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 25px;
}

.section h3 {
    margin-top: 0;
}

.input-box,
textarea {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
    margin-bottom: 10px;
}

textarea {
    min-height: 110px;
    resize: vertical;
}

.btn {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
    margin-top: 8px;
}

.btn-add {
    background: #3c8dbc;
    color: white;
}

.btn-remove {
    background: #6c7f99;
    color: white;
}

.btn-save {
    background: #2ecc71;
    color: white;
}
</style>
</head>

<body>

<h2>🎤 LAPORAN PERHIMPUNAN</h2>

<!-- ====================== -->
<!-- UCAPAN PENTADBIR -->
<!-- ====================== -->
<div class="section">
    <h3>Ucapan Pentadbir</h3>

    <input type="text" 
           class="input-box nama-search" 
           placeholder="Nama Pentadbir"
           oninput="searchNama(this)">

    <div id="komen_pentadbir"></div>

    <button class="btn btn-add" onclick="addKomen('pentadbir')">+ Tambah Perenggan</button>
</div>


<!-- ====================== -->
<!-- GURU BERTUGAS -->
<!-- ====================== -->
<div class="section">
    <h3>Guru Bertugas Perhimpunan</h3>

    <input type="text" 
           class="input-box nama-search" 
           placeholder="Nama Guru Bertugas"
           oninput="searchNama(this)">

    <div id="komen_guru"></div>

    <button class="btn btn-add" onclick="addKomen('guru')">+ Tambah Perenggan</button>
</div>


<!-- ====================== -->
<!-- NAMA PELAPOR -->
<!-- ====================== -->
<div class="section">
    <h3>Nama Guru Pelapor</h3>

    <input type="text" 
           class="input-box nama-search" 
           placeholder="Nama Pelapor"
           oninput="searchNama(this)">
</div>


<button class="btn btn-save" onclick="submitPerhimpunan()">💾 Simpan</button>

</body>
</html>
