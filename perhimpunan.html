<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Laporan Perhimpunan</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="nameset.js"></script>
<script src="perhimpunan.js"></script>

<style>
body {
    background: #243B55;
    font-family: sans-serif;
    color: white;
    margin: 0;
    padding: 20px;
}

h2 {
    text-align: center;
    margin-bottom: 25px;
}

.section {
    background: #2f4a6a;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 25px;
}

.input-box,
textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
    margin-bottom: 12px;
}

textarea {
    min-height: 110px;
    resize: vertical;
}

.btn {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
    margin-top: 8px;
}

.add-btn {
    width: auto;
    padding: 6px 12px;
    font-size: 13px;
    border-radius: 20px;
    border: none;
    background-color: rgba(255,255,255,0.15);
    color: white;
    margin-top: 0;
}

.remove-btn {
    padding: 5px 10px;
    font-size: 12px;
    border-radius: 4px;
    border: none;
    background: #c0392b;
    color: white;
    margin-bottom: 8px;
}

.btn-save {
    background: #2ecc71;
    color: white;
}
</style>

<link rel="stylesheet" href="theme.css">
</head>

<body>

<h2>LAPORAN PERHIMPUNAN</h2>

<!-- ====================== -->
<!-- UCAPAN PENTADBIR -->
<!-- ====================== -->
<div class="section">
    <h3>Ucapan Pentadbir</h3>

    <input type="text"
           id="nama_pentadbir"
           class="input-box"
           list="pentadbir_list"
           placeholder="Nama Pentadbir">

    <div id="komen_pentadbir"></div>

    <button class="add-btn" onclick="addKomen('pentadbir')">
        + Tambah Ucapan
    </button>
</div>

<!-- ====================== -->
<!-- GURU BERTUGAS -->
<!-- ====================== -->
<div class="section">
    <h3>Guru Bertugas Perhimpunan</h3>

    <input type="text"
           id="nama_guru"
           class="input-box"
           list="guru_list"
           placeholder="Nama Guru Bertugas">

    <div id="komen_guru"></div>

    <button class="add-btn" onclick="addKomen('guru')">
        + Tambah Ucapan
    </button>
</div>

<!-- ====================== -->
<!-- NAMA PELAPOR -->
<!-- ====================== -->
<div class="section">
    <h3>Nama Guru Pelapor</h3>

    <input type="text"
           id="nama_pelapor"
           class="input-box"
           list="guru_list"
           placeholder="Nama Pelapor">
</div>

<!-- ====================== -->
<!-- DATA LIST -->
<!-- ====================== -->
<datalist id="guru_list"></datalist>
<datalist id="pentadbir_list"></datalist>

<button class="btn btn-save" onclick="submitPerhimpunan()">
    💾 Simpan
</button>

<script src="brand.js"></script>

</body>
</html>
