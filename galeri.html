<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Galeri Laporan</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="galeri.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    background: #243B55;
    font-family: sans-serif;
    color: white;
    margin: 0;
    padding: 20px;
}

h2 {
    text-align: center;
    margin-bottom: 24px;
}

.section {
    background: #2f4a6a;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 16px;
    overflow: hidden;
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

input, select {
    display: block;
    width: 100%;
    max-width: 100%;
    min-width: 0;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
    margin-bottom: 12px;
}

input[type="date"] {
    -webkit-appearance: none;
    appearance: none;
}

button {
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
    margin-top: 8px;
    background: #2ecc71;
    color: white;
}

.history-title {
    font-size: 14px;
    opacity: 0.95;
    margin-bottom: 10px;
    font-weight: bold;
}

.history-list {
    list-style: none;
    padding: 0;
    margin: 0;
    display: grid;
    gap: 8px;
}

.history-item {
    background: rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    line-height: 1.45;
}

.empty-history {
    opacity: 0.8;
    font-size: 13px;
}
</style>

<link rel="stylesheet" href="theme.css?v=20260215b">
</head>
<body>

  <h2>GALERI LAPORAN</h2>

  <div class="section">
    <label for="tarikh">Tarikh Laporan</label>
    <input type="date" id="tarikh" />

    <label for="sesi">Sesi</label>
    <select id="sesi">
      <option value="">- Sila Pilih -</option>
      <option value="PAGI">Pagi</option>
      <option value="PETANG">Petang</option>
    </select>

    <button id="btnCari">Cari Laporan</button>
  </div>

  <div class="section">
    <div class="history-title">📌 10 Laporan Terkini Diterima</div>
    <ul id="historyList" class="history-list"></ul>
    <div id="emptyHistory" class="empty-history" style="display:none;">
      Tiada rekod laporan diterima setakat ini.
    </div>
  </div>

  <script src="brand.js"></script>

</body>
</html>
