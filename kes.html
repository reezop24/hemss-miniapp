<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Laporan Kes</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="nameset.js"></script>
<script src="kes.js"></script>

<style>
body {
    background: #243B55;
    font-family: sans-serif;
    color: white;
    margin: 0;
    padding: 20px;
}

h2 { text-align: center; margin-bottom: 25px; }

.section {
    background: #2f4a6a;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 25px;
}

input, textarea, select {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
    margin-bottom: 12px;
    box-sizing: border-box;
}

textarea {
    min-height: 110px;
    resize: vertical;
}

.btn {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
    margin-top: 8px;
}

.btn-small {
    padding: 8px;
    font-size: 14px;
}

.add-btn {
    width: auto;
    padding: 6px 12px;
    font-size: 13px;
    border-radius: 20px;
    border: none;
    background-color: rgba(255,255,255,0.15);
    color: white;
}

.remove-btn {
    padding: 5px 10px;
    font-size: 12px;
    border-radius: 4px;
    border: none;
    background: #c0392b;
    color: white;
    margin-bottom: 8px;
}

.btn-save { background: #2ecc71; color: white; }

.pelajar-row {
    margin-bottom: 12px;
}

.pelajar-meta {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 8px;
    align-items: center;
    margin-top: 8px;
}

.pelajar-meta select {
    margin-bottom: 0;
}

.pelajar-row .remove-btn {
    margin-bottom: 0;
    white-space: nowrap;
}
</style>

<link rel="stylesheet" href="theme.css?v=20260214a">
</head>

<body>

<h2>LAPORAN KES DISIPLIN, KEMALANGAN & BENCANA</h2>

<div class="section">
    <h3>Nama Guru Pelapor</h3>
    <select id="pelapor">
        <option value="">- Sila Pilih Nama Guru Pelapor -</option>
    </select>
</div>

<div id="kes_container"></div>

<button class="add-btn" onclick="addKes(true)">+ Tambah Laporan</button>

<button class="btn btn-save" onclick="submitKes()">💾 Simpan</button>
<div id="read-only-status" class="section" style="display:none;">
    <h3>STATUS</h3>
    <div style="font-weight:600;">READ ONLY</div>
    <div style="margin-top:8px; opacity:0.9;">Bahagian ini telah disimpan. Tekan butang di bawah untuk ubah semula.</div>
</div>
<button id="edit-btn" class="btn btn-save" style="display:none;">✏️ Ubah Semula</button>

<script src="brand.js"></script>

</body>
</html>
