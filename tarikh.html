<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Pilih Tarikh Laporan</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="tarikh.js"></script>

<style>
body {
    background: #243B55;
    font-family: sans-serif;
    color: white;
    margin: 0;
    padding: 20px;
}

h2 {
    text-align: center;
    margin-bottom: 30px;
}

.section {
    background: #2f4a6a;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

input, select {
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
    min-width: 0;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
    margin-bottom: 15px;
}

input[type="date"] {
    display: block;
    -webkit-appearance: none;
    appearance: none;
}

.btn {
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
    margin-top: 10px;
    background: #2ecc71;
    color: white;
}

.section {
    overflow: hidden;
}

.tarikh-warning {
    margin-top: 10px;
    font-size: 14px;
    line-height: 1.5;
    color: rgba(255, 255, 255, 0.92);
}
</style>

<link rel="stylesheet" href="theme.css?v=20260214a">
</head>

<body>

<h2>PILIH TARIKH LAPORAN</h2>

<div class="section">

    <label>Tarikh</label>
    <input type="date" id="tarikh">

    <label>Sesi</label>
    <select id="sesi">
        <option value="">- Sila Pilih -</option>
        <option value="PAGI">Pagi</option>
        <option value="PETANG">Petang</option>
    </select>

    <button class="btn" onclick="submitTarikh()">Teruskan</button>

    <div class="tarikh-warning">
        ⚠️ Sila pastikan tarikh dan sesi yang dipilih benar-benar mengikut jadual giliran bertugas anda.
    </div>

</div>

<script src="brand.js"></script>

</body>
</html>
