<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Pilih Tarikh Laporan</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="menu.js" defer></script>

  <style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #1e3a5f;
    color: white;
    padding: 24px;
    font-size: 26px; /* BESAR GLOBAL */
  }

  h2 {
    text-align: center;
    margin-bottom: 18px;
    font-size: 22px;
  }

  .warning-box {
    background: rgba(255, 255, 255, 0.12);
    padding: 18px;
    border-radius: 12px;
    font-size: 25px; /* BESARKAN */
    line-height: 1.6;
    margin-bottom: 30px;
  }

  .warning-box strong {
    color: #ffd966;
  }

  .container {
    margin-top: 10px;
  }

  input[type="date"] {
    width: 100%;
    padding: 16px;
    font-size: 28px; /* BESARKAN DATE */
    border-radius: 10px;
    border: none;
    box-sizing: border-box;
  }

  button {
    width: 100%;
    margin-top: 28px;
    padding: 16px;
    font-size: 28px; /* BESAR BUTTON */
    border-radius: 10px;
    border: none;
    background-color: #4da3ff;
    color: white;
    cursor: pointer;
    font-weight: 600;
  }

  button:active {
    opacity: 0.85;
  }
</style>

</head>

<body>

  <h2>📅 Pemilihan Tarikh Laporan</h2>

  <div class="warning-box">
    ⚠️ <strong>Perhatian:</strong><br><br>
    Sila pastikan tarikh yang dipilih adalah tepat mengikut jadual guru bertugas.
    <br><br>
    Pemilihan tarikh yang salah boleh menyebabkan laporan dikunci dan
    menyukarkan guru lain untuk mengemaskini laporan sebenar.
  </div>

  <div class="container">
    <input type="date" id="tarikhInput" />
    <button onclick="hantarTarikh()">Sahkan Tarikh</button>
  </div>

</body>
</html>
