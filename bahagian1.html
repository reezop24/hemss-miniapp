<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Bahagian 1 - Laporan Kehadiran</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    .container {
      padding: 16px;
    }

    .header {
      text-align: center;
      margin-bottom: 12px;
    }

    .header h1 {
      font-size: 18px;
      margin: 0;
    }

    .header h2 {
      font-size: 15px;
      margin-top: 6px;
    }

    hr {
      border: none;
      border-top: 1px solid #ddd;
      margin: 16px 0;
    }

    .section-title {
      font-weight: 600;
      margin-bottom: 8px;
    }

    input, select, textarea {
      width: 100%;
      min-height: 44px;
      padding: 8px;
      margin-bottom: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 6px;
      text-align: center;
    }

    th {
      background: #eee;
    }

    .attendance-box {
      display: flex;
      justify-content: center;
      gap: 4px;
    }

    .small-input {
      width: 48px;
      min-height: 32px;
      font-size: 14px;
    }

    .guru-row {
      display: grid;
      grid-template-columns: 120px 1fr 40px;
      gap: 6px;
      margin-bottom: 6px;
      align-items: center;
    }

    .remove-btn {
      background: #e74c3c;
      color: #fff;
      border: none;
      border-radius: 6px;
      height: 40px;
      font-size: 18px;
    }

    .add-btn {
      background: #2ecc71;
      color: #fff;
      border: none;
      border-radius: 6px;
      height: 44px;
      font-size: 16px;
      width: 100%;
      margin-top: 8px;
    }

    .save-btn {
      background: #27ae60;
      color: #fff;
      border: none;
      border-radius: 6px;
      height: 48px;
      font-size: 16px;
      width: 100%;
    }
  </style>
</head>

<body>

<form class="container" id="reportForm">

  <div class="header">
    <h1>Unit HEM SMK Seri Sendayan</h1>
    <h2>LAPORAN GURU BERTUGAS MINGGUAN</h2>
  </div>

  <hr>

  <div>
    <div class="section-title">1. Kumpulan Guru Bertugas</div>
    <input name="guru1" placeholder="Nama Guru 1">
    <input name="guru2" placeholder="Nama Guru 2">
    <input name="guru3" placeholder="Nama Guru 3">
    <input name="guru4" placeholder="Nama Guru 4">
    <input name="guru5" placeholder="Nama Guru 5">
  </div>

  <hr>

  <div>
    <div class="section-title">2. Minggu</div>
    <select name="minggu">
      <option value="1">Minggu 1</option>
      <option value="2">Minggu 2</option>
      <option value="3">Minggu 3</option>
      <option value="4">Minggu 4</option>
      <option value="5">Minggu 5</option>
    </select>
  </div>

  <hr>

  <div>
    <div class="section-title">3. Tarikh</div>
    <input type="date" name="tarikh">
  </div>

  <hr>

  <div>
    <div class="section-title">4. Hari</div>
    <select name="hari">
      <option>Isnin</option>
      <option>Selasa</option>
      <option>Rabu</option>
      <option>Khamis</option>
      <option>Jumaat</option>
    </select>
  </div>

  <hr>

  <div>
    <div class="section-title">6. Keberadaan Guru</div>

    <div id="guru-container">
      <div class="guru-row">
        <select name="status[]">
          <option>CR</option>
          <option>CTR</option>
          <option>CRK</option>
          <option>MC</option>
          <option>Kuarantin</option>
          <option>Bengkel</option>
          <option>Mesyuarat</option>
          <option>Taklimat</option>
          <option>Temujanji</option>
          <option>Rawatan</option>
          <option>Lain-lain</option>
        </select>
        <input name="nama_guru[]" placeholder="Nama Guru">
        <button type="button" class="remove-btn">−</button>
      </div>
    </div>

    <button type="button" class="add-btn">+ Tambah Baris</button>
  </div>

  <hr>

  <div>
    <div class="section-title">Komen</div>
    <textarea name="komen"></textarea>
  </div>

  <button type="button" id="btnSubmit" class="save-btn">
    💾 Simpan Laporan
  </button>

</form>

<script src="/app.js"></script>

</body>
</html>
