<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bahagian 1 - Laporan</title>

  <!-- Telegram WebApp -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
    }

    .container { padding: 16px; }
    h1, h2 { text-align: center; margin: 4px 0; }
    h1 { font-size: 18px; }
    h2 { font-size: 15px; font-weight: normal; }
    hr { margin: 20px 0; }

    label {
      display: block;
      font-weight: 600;
      margin-top: 14px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 15px;
      background: #fff;
    }

    textarea { min-height: 80px; }

    /* ===== TABLE ===== */
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 6px;
      text-align: center;
    }

    th { background: #f0f0f0; }

    .attendance-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .small {
      width: 48px;
      text-align: center;
    }

    /* ===== GURU ROW ===== */
    .guru-row {
      display: grid;
      grid-template-columns: 120px 1fr 40px;
      gap: 6px;
      margin-top: 6px;
      background: #fff;
      padding: 6px;
      border-radius: 6px;
    }

    .remove-btn {
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 18px;
    }

    .add-btn, .save-btn {
      width: 100%;
      padding: 12px;
      margin-top: 16px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      color: white;
    }

    .add-btn { background: #2ecc71; }
    .save-btn { background: #27ae60; }

    @media (max-width: 480px) {
      .guru-row { grid-template-columns: 1fr 1fr 40px; }
    }
  </style>
</head>

<body>
<form id="reportForm">
<div class="container">

  <h1>Unit HEM SMK Seri Sendayan</h1>
  <h2>LAPORAN GURU BERTUGAS MINGGUAN</h2>

  <hr>

  <!-- 1. Kumpulan Guru -->
  <label>1. Kumpulan Guru Bertugas</label>
  <input class="name-search" name="guru1" placeholder="Nama Guru 1">
  <input class="name-search" name="guru2" placeholder="Nama Guru 2">
  <input class="name-search" name="guru3" placeholder="Nama Guru 3">
  <input class="name-search" name="guru4" placeholder="Nama Guru 4">
  <input class="name-search" name="guru5" placeholder="Nama Guru 5">
  
  <hr>

  <!-- 2. Minggu -->
  <label>2. Minggu</label>
  <select name="minggu">
    <option>Minggu 1</option>
    <option>Minggu 2</option>
    <option>Minggu 3</option>
    <option>Minggu 4</option>
    <option>Minggu 5</option>
  </select>

  <hr>

  <!-- 3. Tarikh -->
  <label>3. Tarikh</label>
  <input type="date" name="tarikh">

  <hr>

  <!-- 4. Hari -->
  <label>4. Hari</label>
  <select name="hari" id="hariSelect"></select>

  <hr>

  <!-- 5. Kehadiran Murid -->
  <label>5. Laporan Kehadiran Murid</label>

  <table>
    <thead>
      <tr>
        <th>Tingkatan</th>
        <th>Kelas</th>
        <th>Hadir / Daftar</th>
      </tr>
    </thead>
    <tbody id="attendanceBody"></tbody>
    <tfoot>
      <tr>
        <td colspan="2"><strong>Jumlah Hadir</strong></td>
        <td id="jumlahHadir">0 / 0</td>
      </tr>
      <tr>
        <td colspan="2"><strong>Peratus Kehadiran</strong></td>
        <td id="peratusHadir">0%</td>
      </tr>
    </tfoot>
  </table>

  <hr>

  <!-- 6. Keberadaan Guru -->
  <label>6. Keberadaan Guru</label>

  <div id="guruContainer">
    <div class="guru-row">
      <select name="status[]"></select>
      <input name="nama_status[]" placeholder="Nama Guru">
      <button type="button" class="remove-btn">−</button>
    </div>
  </div>

  <button type="button" class="add-btn" id="addRow">+ Tambah Baris</button>

  <hr>

  <!-- Komen -->
  <label>Komen</label>
  <textarea name="komen"></textarea>

  <button type="button" class="save-btn" id="btnSubmit">💾 Simpan Laporan</button>

</div>
</form>

<script src="nameset.js"></script>  
<script src="presets.js"></script>
<script src="app.js"></script>
</body>
</html>
