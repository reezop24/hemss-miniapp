<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bahagian 1 - Laporan</title>

  <!-- Telegram WebApp WAJIB -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
    }

    .container {
      padding: 16px;
    }

    h1, h2 {
      text-align: center;
      margin: 4px 0;
    }

    h1 { font-size: 18px; }
    h2 { font-size: 15px; font-weight: normal; }

    hr { margin: 16px 0; }

    label {
      font-weight: 600;
      margin-top: 8px;
      display: block;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    textarea { min-height: 80px; }

    /* ===== KEHADIRAN TABLE ===== */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 6px;
      text-align: center;
    }

    .small {
      width: 48px;
    }

    /* ===== GURU ROW ===== */
    .guru-row {
      display: grid;
      grid-template-columns: 120px 1fr 40px;
      gap: 6px;
      margin-top: 6px;
    }

    .remove-btn {
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 18px;
    }

    .add-btn, .save-btn {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      color: white;
    }

    .add-btn { background: #2ecc71; }
    .save-btn { background: #27ae60; }
  </style>
</head>

<body>
<form id="reportForm">
<div class="container">

  <h1>Unit HEM SMK Seri Sendayan</h1>
  <h2>LAPORAN GURU BERTUGAS MINGGUAN</h2>

  <hr>

  <!-- 1. Guru -->
  <label>1. Kumpulan Guru Bertugas</label>
  <input name="guru1" placeholder="Nama Guru 1">
  <input name="guru2" placeholder="Nama Guru 2">
  <input name="guru3" placeholder="Nama Guru 3">
  <input name="guru4" placeholder="Nama Guru 4">
  <input name="guru5" placeholder="Nama Guru 5">

  <hr>

  <!-- 2. Minggu -->
  <label>2. Minggu</label>
  <select name="minggu">
    <option>Minggu 1</option>
    <option>Minggu 2</option>
    <option>Minggu 3</option>
    <option>Minggu 4</option>
    <option>Minggu 5</option>
  </select>

  <hr>

  <!-- 3. Tarikh -->
  <label>3. Tarikh</label>
  <input type="date" name="tarikh">

  <hr>

  <!-- 4. Kehadiran -->
  <label>4. Laporan Kehadiran Murid</label>

  <table>
    <tr>
      <th>Tingkatan</th>
      <th>Kelas</th>
      <th>Hadir / Daftar</th>
    </tr>

    <tr>
      <td>
        <select name="tingkatan_1">
          <option>1</option><option>2</option><option>3</option>
          <option>4</option><option>5</option>
        </select>
      </td>
      <td>
        <select name="kelas_1">
          <option>Seroja</option><option>Mawar</option><option>Melati</option>
        </select>
      </td>
      <td>
        <input class="small" name="hadir_1" type="number"> /
        <input class="small" name="daftar_1" type="number">
      </td>
    </tr>
  </table>

  <hr>

  <!-- 5. Keberadaan Guru -->
  <label>5. Keberadaan Guru</label>

  <div id="guruContainer">
    <div class="guru-row">
      <select name="status_1">
        <option>CR</option>
        <option>MC</option>
        <option>Mesyuarat</option>
        <option>Lain-lain</option>
      </select>
      <input name="nama_status_1" placeholder="Nama Guru">
      <button type="button" class="remove-btn">−</button>
    </div>
  </div>

  <button type="button" class="add-btn" id="addRow">+ Tambah Baris</button>

  <hr>

  <!-- Komen -->
  <label>Komen</label>
  <textarea name="komen"></textarea>

  <button type="button" class="save-btn" id="btnSubmit">💾 Simpan Laporan</button>

</div>
</form>

<script src="app.js"></script>
</body>
</html>
