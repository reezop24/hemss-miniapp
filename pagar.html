<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Laporan Pagar 2</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="nameset.js"></script>
<script src="pagar.js"></script>

<style>
body {
    background: #243B55;
    font-family: sans-serif;
    color: white;
    margin: 0;
    padding: 20px;
}

h2 {
    text-align: center;
    margin-bottom: 25px;
}

.section {
    background: #2f4a6a;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 25px;
}

.input-box,
textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
    margin-bottom: 12px;
}

textarea {
    min-height: 110px;
    resize: vertical;
}

.btn {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
    margin-top: 8px;
}

.add-btn {
    width: auto;
    padding: 6px 12px;
    font-size: 13px;
    border-radius: 20px;
    border: none;
    background-color: rgba(255,255,255,0.15);
    color: white;
}

.remove-btn {
    padding: 5px 10px;
    font-size: 12px;
    border-radius: 4px;
    border: none;
    background: #c0392b;
    color: white;
    margin-bottom: 8px;
}

.btn-save {
    background: #2ecc71;
    color: white;
}
</style>

<link rel="stylesheet" href="theme.css">
</head>

<body>

<h2>🚪 LAPORAN PAGAR 2</h2>

<!-- GURU PELAPOR -->
<div class="section">
    <h3>Nama Guru Pelapor</h3>
    <input type="text" class="input-box" list="guru_list" placeholder="Nama Guru">
</div>

<!-- PELAJAR LEWAT -->
<div class="section">
    <h3>Nama Pelajar Lewat</h3>

    <div id="pelajar_container"></div>

    <button class="add-btn" onclick="addPelajar()">+ Tambah Nama</button>

    <h3>Catatan</h3>

    <div id="catatan_container"></div>

    <button class="add-btn" onclick="addCatatan()">+ Tambah Catatan</button>
</div>

<datalist id="guru_list"></datalist>

<button class="btn btn-save" onclick="submitPagar()">💾 Simpan</button>

<script src="brand.js"></script>

</body>
</html>
