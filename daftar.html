<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Pendaftaran Kali Pertama</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="nameset.js"></script>
<script src="daftar.js"></script>
<link rel="stylesheet" href="theme.css?v=20260215a">

<style>
body {
  background: #243B55;
  font-family: sans-serif;
  color: white;
  margin: 0;
  padding: 20px;
}

h2 {
  text-align: center;
  margin-bottom: 24px;
}

.section {
  background: #2f4a6a;
  padding: 20px;
  border-radius: 12px;
}

.grid {
  display: grid;
  gap: 12px;
}

@media (min-width: 700px) {
  .grid {
    grid-template-columns: 1fr 1fr;
  }
}

label {
  display: block;
  margin-bottom: 8px;
  font-weight: bold;
}

.notice-red {
  color: #ff4d4f;
  font-size: 18px;
  font-weight: 800;
  margin-bottom: 8px;
  line-height: 1.3;
}

input {
  width: 100%;
  box-sizing: border-box;
  padding: 14px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  margin-bottom: 12px;
}

.status-line {
  min-height: 20px;
  font-size: 13px;
  opacity: 0.95;
  margin-top: -4px;
  margin-bottom: 10px;
}

.hint {
  font-size: 13px;
  opacity: 0.9;
  margin-bottom: 14px;
}

.btn {
  width: 100%;
  box-sizing: border-box;
  padding: 14px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  margin-top: 6px;
  background: #2ecc71;
  color: white;
}

.btn-secondary {
  background: #1abc9c;
}
</style>
</head>
<body>
  <h2>PENDAFTARAN KALI PERTAMA</h2>

  <div class="section">
    <div class="grid">
      <div>
        <div class="notice-red">SILA PILIH NAMA ANDA</div>
        <label for="namaGuru">Nama Guru</label>
        <input
          id="namaGuru"
          list="senaraiNamaGuru"
          placeholder="Cari atau pilih nama guru..."
          autocomplete="off"
        >
        <div id="statusGuru" class="status-line"></div>
        <datalist id="senaraiNamaGuru"></datalist>
      </div>

      <div>
        <div class="notice-red">ABAIKAN RUANGAN INI SEKIRANYA ANDA BUKAN PENTADBIR</div>
        <label for="namaPentadbir">Nama Pentadbir Sekolah</label>
        <input
          id="namaPentadbir"
          list="senaraiNamaPentadbir"
          placeholder="Cari atau pilih nama pentadbir sekolah..."
          autocomplete="off"
        >
        <div id="statusPentadbir" class="status-line"></div>
        <datalist id="senaraiNamaPentadbir"></datalist>
      </div>
    </div>

    <div class="hint">
      Isi salah satu sahaja: <strong>Guru</strong> atau <strong>Pentadbir</strong>.
    </div>

    <button class="btn" id="submitDaftar">Sahkan Pendaftaran</button>
    <button class="btn btn-secondary" id="superLoginBtn" style="display:none;">
      🔐 Masuk Sebagai Superuser
    </button>
  </div>

  <script src="brand.js"></script>
</body>
</html>
