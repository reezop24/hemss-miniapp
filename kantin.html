<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Laporan Kantin</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="nameset.js"></script>
<script src="kantin.js"></script>

<style>
body {
    background: #243B55;
    font-family: sans-serif;
    color: white;
    margin: 0;
    padding: 20px;
}

h2 {
    text-align: center;
    margin-bottom: 25px;
}

.section {
    background: #2f4a6a;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 25px;
}

.section h3 {
    margin-top: 0;
}

.input-box,
textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
    margin-bottom: 12px;
}

textarea {
    min-height: 110px;
    resize: vertical;
}

.btn {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
    margin-top: 8px;
}

.btn-add {
    background: #3c8dbc;
    color: white;
}

.btn-remove {
    background: #6c7f99;
    color: white;
}

.btn-save {
    background: #2ecc71;
    color: white;
}

.suggestion-box {
    position: absolute;
    background: white;
    color: black;
    border-radius: 10px;
    max-height: 180px;
    overflow-y: auto;
    z-index: 9999;
}
</style>
</head>

<body>

<h2>🍽 LAPORAN KANTIN</h2>

<div class="section">
    <h3>Nama Guru Pelapor</h3>

    <input type="text"
       class="input-box"
       list="guru_list"
       placeholder="Nama Pelapor">
</div>

<div class="section">
    <h3>Komen / Catatan</h3>

    <div id="komen_kantin"></div>

    <button class="btn btn-add" onclick="addKomen()">+ Tambah Perenggan</button>
</div>
<datalist id="guru_list"></datalist>
<button class="btn btn-save" onclick="submitKantin()">💾 Simpan</button>

</body>
</html>
