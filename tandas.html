<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laporan Tandas</title>


<style>
body {
    background: #243B55;
    font-family: sans-serif;
    color: white;
    margin: 0;
    padding: 20px;
}

h2 {
    text-align: center;
    margin-bottom: 20px;
}

.section {
    background: #2f4a6a;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 25px;
}

input, select, textarea {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
    margin-bottom: 12px;
}

textarea {
    min-height: 110px;
}

.btn {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
    margin-top: 8px;
}

.add-btn {
    width: auto;
    padding: 6px 12px;
    font-size: 13px;
    border-radius: 20px;
    border: none;
    background-color: rgba(255,255,255,0.15);
    color: white;
}

.remove-btn {
    padding: 5px 10px;
    font-size: 12px;
    border-radius: 4px;
    border: none;
    background: #c0392b;
    color: white;
    margin-bottom: 8px;
}

.btn-save { background:#2ecc71; color:white; }
</style>

<link rel="stylesheet" href="theme.css?v=20260214a">
</head>

<body>

<h2>LAPORAN TANDAS</h2>

<!-- ===================== -->
<!-- GURU PELAPOR -->
<!-- ===================== -->
<div class="section">
    <h3>Nama Guru Pelapor</h3>

    <input type="text"
           list="guru_list"
           placeholder="Nama Guru Pelapor">
</div>

<div id="container"></div>

<datalist id="guru_list"></datalist>

<button class="btn btn-save" onclick="submitTandas()">💾 Simpan</button>
<div id="read-only-status" class="section" style="display:none;">
    <h3>STATUS</h3>
    <div style="font-weight:600;">READ ONLY</div>
    <div style="margin-top:8px; opacity:0.9;">Bahagian ini telah disimpan. Tekan butang di bawah untuk ubah semula.</div>
</div>
<button id="edit-btn" class="btn btn-save" style="display:none;">✏️ Ubah Semula</button>


<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="nameset.js"></script>
<script src="tandas.js"></script>


<script src="brand.js"></script>

</body>
</html>
