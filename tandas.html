<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laporan Tandas</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="nameset.js"></script>
<script src="tandas.js"></script>

<style>
body {
    background: #243B55;
    font-family: sans-serif;
    color: white;
    margin: 0;
    padding: 20px;
}

h2 {
    text-align: center;
    margin-bottom: 20px;
}

.section {
    background: #2f4a6a;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 25px;
}

input, select, textarea {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
    margin-bottom: 12px;
}

textarea {
    min-height: 110px;
}

.btn {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
    margin-top: 8px;
}

.btn-add { background:#3c8dbc; color:white; }
.btn-remove { background:#6c7f99; color:white; }
.btn-save { background:#2ecc71; color:white; }
</style>
</head>

<body>

<h2>🚻 LAPORAN TANDAS</h2>

<!-- ===================== -->
<!-- GURU PELAPOR -->
<!-- ===================== -->
<div class="section">
    <h3>Nama Guru Pelapor</h3>

    <input type="text"
           list="guru_list"
           placeholder="Nama Guru Pelapor">
</div>

<div id="container"></div>

<datalist id="guru_list"></datalist>

<button class="btn btn-save" onclick="submitTandas()">💾 Simpan</button>

</body>
</html>
